name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud_mail"
database_id = "D1_DATABASE_ID"

[[kv_namespaces]]
binding = "kv"
id = "KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "r2"
bucket_name = "R2_BUCKET_NAME"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 */1 * * *"]

[vars]
orm_log = false
domain = ["DOMAIN_NAME"]
