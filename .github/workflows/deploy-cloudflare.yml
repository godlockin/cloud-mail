name: 🚀 Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ➡️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./mail-worker/package-lock.json"

      - name: 📥 Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: ./mail-worker

      - name: ⚙️ Configure wrangler.toml
        working-directory: ./mail-worker
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then sed -i "s/D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.toml; fi
          if [ -n "$KV_NAMESPACE_ID" ]; then sed -i "s/KV_NAMESPACE_ID/$KV_NAMESPACE_ID/g" wrangler.toml; fi
          if [ -n "$R2_BUCKET_NAME" ]; then sed -i "s/R2_BUCKET_NAME/$R2_BUCKET_NAME/g" wrangler.toml; fi
          if [ -n "$DOMAIN_NAME" ]; then sed -i "s/DOMAIN_NAME/$DOMAIN_NAME/g" wrangler.toml; fi

      - name: 🚀 Deploy to Cloudflare Workers
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "⚠️ No CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY configured in secrets. Skipping deployment."
            exit 0
          fi
          npx wrangler deploy
